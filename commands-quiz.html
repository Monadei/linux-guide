<script>
(function() {
  function getFromUrl() {
    try {
      var m = window.location.search.match(/[?&]theme=([^&]+)/);
      if (m) return decodeURIComponent(m[1]);
      var h = window.location.hash.match(/theme=([^&]+)/);
      if (h) return decodeURIComponent(h[1]);
    } catch(e) {}
    return null;
  }
  function getFromStorage() {
    try { var v = localStorage.getItem('site-theme'); if (v) return v; } catch(e) {}
    try {
      var m = document.cookie.match(/(?:^|;\s*)site-theme=([^;]+)/);
      if (m) return decodeURIComponent(m[1]);
    } catch(e) {}
    return null;
  }
  var theme = getFromUrl() || getFromStorage() || 'default';
  if (theme && theme !== 'default') {
    document.documentElement.setAttribute('data-site-theme', theme);
  }
  // Сохраняем для следующих страниц
  try { localStorage.setItem('site-theme', theme); } catch(e) {}
  try { document.cookie = 'site-theme=' + encodeURIComponent(theme) + ';path=/;max-age=31536000'; } catch(e) {}
  window.__INITIAL_THEME = theme;
})();
</script>

<script>
var Q = [
  {q:'ls -la', a:['Подробный список с скрытыми файлами','Удалить всё','Создать файл'], c:0},
  {q:'cd -', a:['Вернуться в предыдущую папку','Выйти','Создать папку'], c:0},
  {q:'grep -r "text" .', a:['Рекурсивный поиск текста','Удалить тексты','Создать тексты'], c:0},
  {q:'chmod 755 file', a:['rwxr-xr-x','rw-r--r--','rw-------'], c:0},
  {q:'df -h', a:['Свободное место человекочитаемо','Список файлов','Показать процессы'], c:0},
  {q:'du -sh папка', a:['Размер папки','Дата','Права'], c:0},
  {q:'ps aux', a:['Все процессы','Список пользователей','Порты'], c:0},
  {q:'ip a', a:['Сетевые адреса','Пароли','Пакеты'], c:0},
  {q:'ss -tulpn', a:['Открытые порты','Список дисков','Пользователей'], c:0},
  {q:'tar -czf a.tar.gz папка', a:['Запаковать в архив','Распаковать','Удалить'], c:0},
  {q:'rsync -avh --delete', a:['Синхронизация с удалением','Скачать','Копировать с изменениями'], c:0},
  {q:'journalctl -p err -b', a:['Ошибки с последней загрузки','Все логи','Очистить логи'], c:0},
  {q:'systemctl enable', a:['Автозапуск','Запустить','Остановить'], c:0},
  {q:'chown user:group file', a:['Сменить владельца','Создать','Удалить'], c:0},
  {q:'apt autoremove', a:['Удалить ненужные пакеты','Обновить','Найти'], c:0},
  {q:'umount /mnt', a:['Отмонтировать','Смонтировать','Форматировать'], c:0},
  {q:'dd if=a.iso of=/dev/sdb', a:['Записать ISO на флешку','Прочитать','Создать файл'], c:0},
  {q:'sudo -i', a:['Root-оболочка','Вход','Информация'], c:0},
  {q:'grep -v', a:['Инвертировать поиск','Вербозный','Все совпадения'], c:0},
  {q:'man 5 passwd', a:['Формат файла passwd','Команду passwd','Ядро'], c:0}
];
var round = 0, score = 0, current, options;
var cont = document.getElementById('game');
function next() {
  if (round >= Q.length) return finish();
  current = Q[round]; round++;
  options = current.a.slice().sort(function(){return Math.random()-0.5;});
  var html = '<div class="test-q"><h3>' + round + '/20 — Что делает <code>' + current.q + '</code>?</h3>';
  options.forEach(function(o){
    html += '<label><input type="radio" name="q" value="' + o + '">' + o + '</label>';
  });
  html += '<button class="btn" onclick="answer()" style="margin-top:0.8rem;">Ответить</button></div>';
  cont.innerHTML = html;
}
function answer() {
  var sel = document.querySelector('input[name="q"]:checked');
  if (!sel) { alert('Выбери вариант'); return; }
  var correct = current.a[current.c];
  if (sel.value === correct) score++;
  var was = sel.value === correct ? '✅ Верно!' : '❌ Правильно: ' + correct;
  cont.innerHTML = '<div class="test-result"><h3>' + was + '</h3><p>Очки: ' + score + ' / ' + round + '</p><button class="btn" onclick="next()">Дальше →</button></div>';
}
function finish() {
  var lvl = score >= 18 ? 'Ты терминал-ниндзя!' : score >= 13 ? 'Хорошо знаешь команды.' : score >= 8 ? 'База есть.' : 'Читай шпаргалку.';
  cont.innerHTML = '<div class="test-result"><h2>Финал: ' + score + ' / 20</h2><p>' + lvl + '</p><a href="terminal-cheatsheet.html" class="btn">Шпаргалка →</a> <button class="btn" onclick="round=0;score=0;next()">Ещё раз</button></div>';
}
next();
</script>
