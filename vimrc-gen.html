<script>
(function() {
  function getFromUrl() {
    try {
      var m = window.location.search.match(/[?&]theme=([^&]+)/);
      if (m) return decodeURIComponent(m[1]);
      var h = window.location.hash.match(/theme=([^&]+)/);
      if (h) return decodeURIComponent(h[1]);
    } catch(e) {}
    return null;
  }
  function getFromStorage() {
    try { var v = localStorage.getItem('site-theme'); if (v) return v; } catch(e) {}
    try {
      var m = document.cookie.match(/(?:^|;\s*)site-theme=([^;]+)/);
      if (m) return decodeURIComponent(m[1]);
    } catch(e) {}
    return null;
  }
  var theme = getFromUrl() || getFromStorage() || 'default';
  if (theme && theme !== 'default') {
    document.documentElement.setAttribute('data-site-theme', theme);
  }
  // Сохраняем для следующих страниц
  try { localStorage.setItem('site-theme', theme); } catch(e) {}
  try { document.cookie = 'site-theme=' + encodeURIComponent(theme) + ';path=/;max-age=31536000'; } catch(e) {}
  window.__INITIAL_THEME = theme;
})();
</script>

<script>
function generate() {
  var l = ['" ~/.vimrc — сгенерировано на Linux Guide', '" Monadei, 2026', ''];
  if (document.getElementById('syntax').checked) { l.push('syntax on'); l.push('filetype plugin indent on'); }
  if (document.getElementById('nums').checked) { l.push('set number'); l.push('set relativenumber'); }
  if (document.getElementById('mouse').checked) l.push('set mouse=a');
  if (document.getElementById('tabs').checked) {
    l.push('set tabstop=4');
    l.push('set shiftwidth=4');
    l.push('set expandtab');
    l.push('set smartindent');
    l.push('set autoindent');
  }
  if (document.getElementById('search').checked) {
    l.push('set ignorecase');
    l.push('set smartcase');
    l.push('set incsearch');
    l.push('set hlsearch');
  }
  if (document.getElementById('colors').checked) { l.push('set termguicolors'); l.push('colorscheme gruvbox'); }
  if (document.getElementById('clipboard').checked) { l.push('set clipboard=unnamedplus'); }
  if (document.getElementById('brackets').checked) {
    l.push('inoremap ( ()<Esc>i');
    l.push('inoremap [ []<Esc>i');
    l.push('inoremap { {}<Esc>i');
    l.push('inoremap " ""<Esc>i');
    l.push('inoremap \'\'<Esc>i');
  }
  l.push('');
  l.push('" Мелочи');
  l.push('set encoding=utf-8');
  l.push('set scrolloff=5');
  l.push('set ruler');
  l.push('set showcmd');
  l.push('set wildmenu');
  l.push('set backupdir=~/.vim/backup//');
  l.push('set directory=~/.vim/swap//');
  document.getElementById('out').textContent = l.join('\n');
}
function download() {
  generate();
  var blob = new Blob([document.getElementById('out').textContent], { type: 'text/plain' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'vimrc';
  a.click();
}
generate();
</script>
