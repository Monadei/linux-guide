<script>
(function() {
  function getFromUrl() {
    try {
      var m = window.location.search.match(/[?&]theme=([^&]+)/);
      if (m) return decodeURIComponent(m[1]);
      var h = window.location.hash.match(/theme=([^&]+)/);
      if (h) return decodeURIComponent(h[1]);
    } catch(e) {}
    return null;
  }
  function getFromStorage() {
    try { var v = localStorage.getItem('site-theme'); if (v) return v; } catch(e) {}
    try {
      var m = document.cookie.match(/(?:^|;\s*)site-theme=([^;]+)/);
      if (m) return decodeURIComponent(m[1]);
    } catch(e) {}
    return null;
  }
  var theme = getFromUrl() || getFromStorage() || 'default';
  if (theme && theme !== 'default') {
    document.documentElement.setAttribute('data-site-theme', theme);
  }
  // Сохраняем для следующих страниц
  try { localStorage.setItem('site-theme', theme); } catch(e) {}
  try { document.cookie = 'site-theme=' + encodeURIComponent(theme) + ';path=/;max-age=31536000'; } catch(e) {}
  window.__INITIAL_THEME = theme;
})();
</script>

<p class="lead">Собери конфиг Zsh с Oh-My-Zsh или без.</p>

<label><input type="checkbox" id="omz" checked> Oh-My-Zsh</label><br>
<label><input type="checkbox" id="plugins" checked> Плагины (git, sudo, history)</label><br>
<label><input type="checkbox" id="theme"> Тема agnoster</label><br>
<label><input type="checkbox" id="aliases" checked> Алиасы</label><br>
<label><input type="checkbox" id="history" checked> Улучшенная история</label><br>
<label><input type="checkbox" id="syntax"> zsh-syntax-highlighting</label><br>
<label><input type="checkbox" id="auto"> zsh-autosuggestions</label><br>

<button class="btn" onclick="generate()" style="margin-top:1rem;">Сгенерировать</button>
<button class="btn" onclick="download()">Скачать .zshrc</button>

<script>
function generate() {
  var l = ['# ~/.zshrc — сгенерировано на Linux Guide', '# Monadei, 2026', ''];
  if (document.getElementById('omz').checked) {
    l.push('# Oh-My-Zsh');
    l.push('export ZSH="$HOME/.oh-my-zsh"');
    if (document.getElementById('theme').checked) l.push('ZSH_THEME="agnoster"');
    else l.push('ZSH_THEME="robbyrussell"');
    if (document.getElementById('plugins').checked) {
      l.push('plugins=(git sudo history colored-man-pages command-not-found)');
    }
    l.push('source $ZSH/oh-my-zsh.sh');
    l.push('');
  }
  if (document.getElementById('history').checked) {
    l.push('# История');
    l.push('HISTSIZE=10000');
    l.push('SAVEHIST=20000');
    l.push('setopt HIST_IGNORE_ALL_DUPS');
    l.push('setopt HIST_IGNORE_SPACE');
    l.push('setopt SHARE_HISTORY');
    l.push('setopt INC_APPEND_HISTORY');
    l.push('');
  }
  if (document.getElementById('aliases').checked) {
    l.push('# Алиасы');
    l.push("alias ll='ls -alF'");
    l.push("alias la='ls -A'");
    l.push("alias l='ls -CF'");
    l.push("alias ..='cd ..'");
    l.push("alias ...='cd ../..'");
    l.push("alias grep='grep --color=auto'");
    l.push("alias df='df -h'");
    l.push("alias free='free -h'");
    l.push("alias update='sudo apt update && sudo apt upgrade'");
    l.push('');
  }
  if (document.getElementById('syntax').checked) {
    l.push('# zsh-syntax-highlighting');
    l.push('source /usr/share/zsh-syntax-highlighting/zsh-syntax-highlighting.zsh');
    l.push('');
  }
  if (document.getElementById('auto').checked) {
    l.push('# zsh-autosuggestions');
    l.push('source /usr/share/zsh-autosuggestions/zsh-autosuggestions.zsh');
    l.push('');
  }
  document.getElementById('out').textContent = l.join('\n');
}
function download() {
  generate();
  var blob = new Blob([document.getElementById('out').textContent], { type: 'text/plain' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'zshrc';
  a.click();
}
generate();
</script>
