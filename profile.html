<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<script>
(function() {
  function getFromUrl() {
    try {
      var m = window.location.search.match(/[?&]theme=([^&]+)/);
      if (m) return decodeURIComponent(m[1]);
      var h = window.location.hash.match(/theme=([^&]+)/);
      if (h) return decodeURIComponent(h[1]);
    } catch(e) {}
    return null;
  }
  function getFromStorage() {
    try { var v = localStorage.getItem('site-theme'); if (v) return v; } catch(e) {}
    try {
      var m = document.cookie.match(/(?:^|;\s*)site-theme=([^;]+)/);
      if (m) return decodeURIComponent(m[1]);
    } catch(e) {}
    return null;
  }
  var theme = getFromUrl() || getFromStorage() || 'default';
  if (theme && theme !== 'default') {
    document.documentElement.setAttribute('data-site-theme', theme);
  }
  // Сохраняем для следующих страниц
  try { localStorage.setItem('site-theme', theme); } catch(e) {}
  try { document.cookie = 'site-theme=' + encodeURIComponent(theme) + ';path=/;max-age=31536000'; } catch(e) {}
  window.__INITIAL_THEME = theme;
})();
</script>
<title>Мой профиль — Linux Guide</title>
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/extra.css">
<link rel="stylesheet" href="css/mobile.css">
</head>
<body>
<header class="site-header"><div class="container header-inner">
<a href="index.html" class="logo">Linux Guide</a>
<nav class="nav">
<a href="index.html">Главная</a><a href="download.html">Как скачать</a><a href="install.html">Как установить</a><a href="history.html">История</a><a href="distros/index.html">Дистрибутивы</a><a href="about.html">Обо мне</a>
<a href="my-recommendations.html">Рекомендую</a><a href="faq.html">FAQ</a><a href="sitemap.html">Карта сайта</a>
</nav></div></header>
<main class="container page">
<h1>Мой профиль</h1>
<p class="lead">Собери свою карточку Linux-пользователя.</p>

<label>Имя: <input type="text" id="name" style="background:var(--panel);color:var(--text);border:1px solid var(--border);padding:0.3rem;font-family:inherit;"></label><br><br>
<label>Ник: <input type="text" id="nick" style="background:var(--panel);color:var(--text);border:1px solid var(--border);padding:0.3rem;font-family:inherit;"></label><br><br>
<label>Дистрибутив: <input type="text" id="distro" style="background:var(--panel);color:var(--text);border:1px solid var(--border);padding:0.3rem;font-family:inherit;"></label><br><br>
<label>DE: <input type="text" id="de" style="background:var(--panel);color:var(--text);border:1px solid var(--border);padding:0.3rem;font-family:inherit;"></label><br><br>
<label>Опыт (лет): <input type="number" id="years" value="2" style="width:80px;background:var(--panel);color:var(--text);border:1px solid var(--border);padding:0.3rem;font-family:inherit;"></label><br><br>

<button class="btn" onclick="save()">Сохранить</button>
<button class="btn" onclick="load()">Загрузить</button>

<div id="card" style="margin-top:2rem;"></div>
</main>
<footer class="site-footer"><div class="container"><p>Linux Guide — учебный проект. Создал Артём (Monadei), 2026.</p>
<p class="footer-links"><a href="sitemap.html">Карта сайта</a> · <a href="404.html">404</a> · <a href="about.html">Обо мне</a>
<a href="my-recommendations.html">Рекомендую</a> · <a href="faq.html">FAQ</a></p></div></footer>
<script src="js/theme.js"></script><script src="js/search.js"></script><script src="js/extras.js"></script><script src="js/fun.js"></script>
<script>
function save() {
  var p = {
    name: document.getElementById('name').value,
    nick: document.getElementById('nick').value,
    distro: document.getElementById('distro').value,
    de: document.getElementById('de').value,
    years: document.getElementById('years').value
  };
  localStorage.setItem('profile', JSON.stringify(p));
  render(p);
}
function load() {
  var p = JSON.parse(localStorage.getItem('profile') || 'null');
  if (!p) { alert('Профиль не сохранён'); return; }
  document.getElementById('name').value = p.name || '';
  document.getElementById('nick').value = p.nick || '';
  document.getElementById('distro').value = p.distro || '';
  document.getElementById('de').value = p.de || '';
  document.getElementById('years').value = p.years || 0;
  render(p);
}
function render(p) {
  var ach = JSON.parse(localStorage.getItem('ach-unlocked') || '{}');
  var cnt = Object.keys(ach).length;
  document.getElementById('card').innerHTML =
    '<div class="test-result"><h2>' + (p.name || 'Без имени') + '</h2>' +
    '<p><strong>Ник:</strong> ' + (p.nick || '—') + '</p>' +
    '<p><strong>Дистрибутив:</strong> ' + (p.distro || '—') + '</p>' +
    '<p><strong>Окружение:</strong> ' + (p.de || '—') + '</p>' +
    '<p><strong>Опыт:</strong> ' + (p.years || 0) + ' лет</p>' +
    '<p><strong>Ачивок:</strong> ' + cnt + '</p></div>';
}
load();
</script>
<script src="js/site-theme.js"></script>
</body></html>
