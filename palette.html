<p class="lead">Выбери цветовую схему, которая тебе больше нравится. Настройка сохранится в браузере.</p>

<div id="themes-grid" class="themes-grid"></div>

<script src="js/site-theme.js"></script>
<script src="js/extras.js"></script>
<script src="js/music.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  // Полный список тем из твоего theme-picker.js
  var themes = [
    {id: 'default', name: 'Default (Amber)'},
    {id: 'dracula', name: 'Dracula'},
    {id: 'nord', name: 'Nord'},
    {id: 'gruvbox', name: 'Gruvbox'},
    {id: 'tokyo-night', name: 'Tokyo Night'},
    {id: 'catppuccin', name: 'Catppuccin'},
    {id: 'solarized-dark', name: 'Solarized Dark'},
    {id: 'solarized-light', name: 'Solarized Light'},
    {id: 'monokai', name: 'Monokai'},
    {id: 'one-dark', name: 'One Dark'},
    {id: 'material', name: 'Material'},
    {id: 'everforest', name: 'Everforest'},
    {id: 'kanagawa', name: 'Kanagawa'},
    {id: 'rose-pine', name: 'Rosé Pine'},
    {id: 'ayu', name: 'Ayu'},
    {id: 'nightfox', name: 'Nightfox'},
    {id: 'vesper', name: 'Vesper'},
    {id: 'oxocarbon', name: 'Oxocarbon'},
    {id: 'moonfly', name: 'Moonfly'},
    {id: 'sonokai', name: 'Sonokai'},
    {id: 'iceberg', name: 'Iceberg'},
    {id: 'light', name: 'Light'},
    {id: 'github-light', name: 'GitHub Light'}
  ];

  var grid = document.getElementById('themes-grid');

  // Получаем текущую тему
  var currentTheme = document.documentElement.getAttribute('data-site-theme') || 'default';

  themes.forEach(function(theme) {
    var card = document.createElement('div');
    card.className = 'theme-card' + (theme.id === currentTheme ? ' active' : '');
    
    // Создаем превью (3 квадратика: фон, панель, акцент)
    // Чтобы цвета были правильными, применим data-site-theme к превью
    card.innerHTML = `
      <div class="theme-preview" data-site-theme="${theme.id}">
        <div class="tp-bg"></div>
        <div class="tp-panel"></div>
        <div class="tp-accent"></div>
      </div>
      <div class="theme-name">${theme.name}</div>
    `;

    card.addEventListener('click', function() {
      // Убираем активный класс у всех
      document.querySelectorAll('.theme-card').forEach(c => c.classList.remove('active'));
      // Добавляем текущей карточке
      card.classList.add('active');
      
      // Применяем тему к HTML
      if (theme.id === 'default') {
        document.documentElement.removeAttribute('data-site-theme');
        localStorage.setItem('site-theme', 'default');
      } else {
        document.documentElement.setAttribute('data-site-theme', theme.id);
        localStorage.setItem('site-theme', theme.id);
      }
    });

    grid.appendChild(card);
  });
});
</script>
