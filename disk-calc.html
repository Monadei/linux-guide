<script>
(function() {
  function getFromUrl() {
    try {
      var m = window.location.search.match(/[?&]theme=([^&]+)/);
      if (m) return decodeURIComponent(m[1]);
      var h = window.location.hash.match(/theme=([^&]+)/);
      if (h) return decodeURIComponent(h[1]);
    } catch(e) {}
    return null;
  }
  function getFromStorage() {
    try { var v = localStorage.getItem('site-theme'); if (v) return v; } catch(e) {}
    try {
      var m = document.cookie.match(/(?:^|;\s*)site-theme=([^;]+)/);
      if (m) return decodeURIComponent(m[1]);
    } catch(e) {}
    return null;
  }
  var theme = getFromUrl() || getFromStorage() || 'default';
  if (theme && theme !== 'default') {
    document.documentElement.setAttribute('data-site-theme', theme);
  }
  // Сохраняем для следующих страниц
  try { localStorage.setItem('site-theme', theme); } catch(e) {}
  try { document.cookie = 'site-theme=' + encodeURIComponent(theme) + ';path=/;max-age=31536000'; } catch(e) {}
  window.__INITIAL_THEME = theme;
})();
</script>

<script src="js/theme.js"></script><script src="js/search.js"></script><script src="js/extras.js"></script><script>
function calc() {
  var disk = parseInt(document.getElementById('disk').value, 10);
  var ram = parseInt(document.getElementById('ram').value, 10);
  var scheme = document.getElementById('scheme').value;
  var hib = document.getElementById('hib').checked;
  var swap = hib ? ram + 2 : (ram <= 4 ? ram * 2 : 4);

  var html = '<div class="test-result"><h2>Схема разметки</h2><table style="width:100%;border-collapse:collapse;margin-top:1rem;">';
  html += '<tr style="border-bottom:1px solid var(--border);"><th style="text-align:left;color:var(--accent);padding:0.5rem;">Раздел</th><th style="text-align:left;color:var(--accent);padding:0.5rem;">Размер</th><th style="text-align:left;color:var(--accent);padding:0.5rem;">ФС</th><th style="text-align:left;color:var(--accent);padding:0.5rem;">Назначение</th></tr>';

  html += '<tr style="border-bottom:1px solid var(--border);"><td style="padding:0.5rem;">/boot/efi</td><td style="padding:0.5rem;">512 МБ</td><td style="padding:0.5rem;">FAT32</td><td style="padding:0.5rem;color:var(--muted);">UEFI-загрузчик</td></tr>';

  if (scheme === 'simple') {
    var root = disk - 0.5 - swap;
    html += '<tr style="border-bottom:1px solid var(--border);"><td style="padding:0.5rem;">/</td><td style="padding:0.5rem;">' + root.toFixed(1) + ' ГБ</td><td style="padding:0.5rem;">ext4 или Btrfs</td><td style="padding:0.5rem;color:var(--muted);">Вся система и данные</td></tr>';
  } else if (scheme === 'separate') {
    var root2 = Math.min(80, disk * 0.3);
    var home = disk - 0.5 - swap - root2;
    html += '<tr style="border-bottom:1px solid var(--border);"><td style="padding:0.5rem;">/</td><td style="padding:0.5rem;">' + root2.toFixed(1) + ' ГБ</td><td style="padding:0.5rem;">ext4</td><td style="padding:0.5rem;color:var(--muted);">Система</td></tr>';
    html += '<tr style="border-bottom:1px solid var(--border);"><td style="padding:0.5rem;">/home</td><td style="padding:0.5rem;">' + home.toFixed(1) + ' ГБ</td><td style="padding:0.5rem;">ext4 или Btrfs</td><td style="padding:0.5rem;color:var(--muted);">Данные пользователя</td></tr>';
  } else {
    var root3 = 50;
    var varSize = 30;
    var home3 = disk - 0.5 - swap - root3 - varSize;
    html += '<tr style="border-bottom:1px solid var(--border);"><td style="padding:0.5rem;">/</td><td style="padding:0.5rem;">' + root3 + ' ГБ</td><td style="padding:0.5rem;">ext4</td><td style="padding:0.5rem;color:var(--muted);">Система</td></tr>';
    html += '<tr style="border-bottom:1px solid var(--border);"><td style="padding:0.5rem;">/var</td><td style="padding:0.5rem;">' + varSize + ' ГБ</td><td style="padding:0.5rem;">ext4</td><td style="padding:0.5rem;color:var(--muted);">Логи, базы, Docker</td></tr>';
    html += '<tr style="border-bottom:1px solid var(--border);"><td style="padding:0.5rem;">/home</td><td style="padding:0.5rem;">' + home3.toFixed(1) + ' ГБ</td><td style="padding:0.5rem;">Btrfs</td><td style="padding:0.5rem;color:var(--muted);">Данные + снапшоты</td></tr>';
  }

  html += '<tr><td style="padding:0.5rem;">swap</td><td style="padding:0.5rem;">' + swap + ' ГБ</td><td style="padding:0.5rem;">swap</td><td style="padding:0.5rem;color:var(--muted);">' + (hib ? 'Для гибернации' : 'Подкачка') + '</td></tr>';
  html += '</table>';
  html += '<p style="margin-top:1rem;color:var(--muted);font-size:0.9rem;">Совет: для современных дисков и SSD лучше Btrfs — есть снапшоты и сжатие. Для старых систем — ext4.</p>';
  html += '</div>';
  document.getElementById('result').innerHTML = html;
}
calc();
</script>
