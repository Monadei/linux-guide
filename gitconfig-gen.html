<script>
(function() {
  function getFromUrl() {
    try {
      var m = window.location.search.match(/[?&]theme=([^&]+)/);
      if (m) return decodeURIComponent(m[1]);
      var h = window.location.hash.match(/theme=([^&]+)/);
      if (h) return decodeURIComponent(h[1]);
    } catch(e) {}
    return null;
  }
  function getFromStorage() {
    try { var v = localStorage.getItem('site-theme'); if (v) return v; } catch(e) {}
    try {
      var m = document.cookie.match(/(?:^|;\s*)site-theme=([^;]+)/);
      if (m) return decodeURIComponent(m[1]);
    } catch(e) {}
    return null;
  }
  var theme = getFromUrl() || getFromStorage() || 'default';
  if (theme && theme !== 'default') {
    document.documentElement.setAttribute('data-site-theme', theme);
  }
  // Сохраняем для следующих страниц
  try { localStorage.setItem('site-theme', theme); } catch(e) {}
  try { document.cookie = 'site-theme=' + encodeURIComponent(theme) + ';path=/;max-age=31536000'; } catch(e) {}
  window.__INITIAL_THEME = theme;
})();
</script>

<p class="lead">Заполни поля — получи свой конфиг Git.</p>

<label>Имя:<br><input type="text" id="name" value="Monadei" style="width:100%;max-width:400px;padding:0.3rem;background:var(--panel);color:var(--text);border:1px solid var(--border);font-family:inherit;"></label><br><br>
<label>Email:<br><input type="text" id="email" value="monadei@example.com" style="width:100%;max-width:400px;padding:0.3rem;background:var(--panel);color:var(--text);border:1px solid var(--border);font-family:inherit;"></label><br><br>
<label>Редактор:
<select id="editor" style="background:var(--panel);color:var(--text);border:1px solid var(--border);padding:0.3rem;font-family:inherit;">
<option value="nano">nano</option>
<option value="vim">vim</option>
<option value="code --wait">VS Code</option>
<option value="nvim">neovim</option>
</select></label><br><br>
<label><input type="checkbox" id="color" checked> Цветной вывод</label><br>
<label><input type="checkbox" id="autocrlf"> Автопреобразование CRLF (для Windows)</label><br>
<label><input type="checkbox" id="pullrebase" checked> pull.rebase вместо merge</label><br>
<label><input type="checkbox" id="aliases" checked> Полезные алиасы</label><br>

<button class="btn" onclick="generate()" style="margin-top:1rem;">Сгенерировать</button>
<button class="btn" onclick="download()">Скачать .gitconfig</button>

<pre id="out" style="margin-top:1.5rem; background:var(--panel); padding:1rem; border-left:3px solid var(--accent); overflow-x:auto; min-height:100px;"></pre>

<script>
function generate() {
  var l = ['[user]'];
  l.push('    name = ' + document.getElementById('name').value);
  l.push('    email = ' + document.getElementById('email').value);
  l.push('');
  l.push('[core]');
  l.push('    editor = ' + document.getElementById('editor').value);
  if (document.getElementById('color').checked) l.push('    autocrlf = input');
  l.push('    excludesfile = ~/.gitignore_global');
  l.push('');
  l.push('[init]');
  l.push('    defaultBranch = main');
  l.push('');
  if (document.getElementById('pullrebase').checked) {
    l.push('[pull]');
    l.push('    rebase = true');
    l.push('');
  }
  if (document.getElementById('color').checked) {
    l.push('[color]');
    l.push('    ui = auto');
    l.push('');
  }
  if (document.getElementById('aliases').checked) {
    l.push('[alias]');
    l.push('    st = status -sb');
    l.push('    co = checkout');
    l.push('    br = branch');
    l.push('    ci = commit');
    l.push('    lg = log --oneline --graph --decorate --all');
    l.push('    last = log -1 HEAD');
    l.push('    unstage = reset HEAD --');
    l.push('    amend = commit --amend --no-edit');
    l.push('    pushf = push --force-with-lease');
    l.push('    clean-branches = !git branch --merged | grep -v \"\\\\*\\|main\\|master\" | xargs -n 1 git branch -d');
  }
  document.getElementById('out').textContent = l.join('\n');
}
function download() {
  generate();
  var blob = new Blob([document.getElementById('out').textContent], { type: 'text/plain' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'gitconfig';
  a.click();
}
generate();
</script>
