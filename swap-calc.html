<script>
(function() {
  function getFromUrl() {
    try {
      var m = window.location.search.match(/[?&]theme=([^&]+)/);
      if (m) return decodeURIComponent(m[1]);
      var h = window.location.hash.match(/theme=([^&]+)/);
      if (h) return decodeURIComponent(h[1]);
    } catch(e) {}
    return null;
  }
  function getFromStorage() {
    try { var v = localStorage.getItem('site-theme'); if (v) return v; } catch(e) {}
    try {
      var m = document.cookie.match(/(?:^|;\s*)site-theme=([^;]+)/);
      if (m) return decodeURIComponent(m[1]);
    } catch(e) {}
    return null;
  }
  var theme = getFromUrl() || getFromStorage() || 'default';
  if (theme && theme !== 'default') {
    document.documentElement.setAttribute('data-site-theme', theme);
  }
  // Сохраняем для следующих страниц
  try { localStorage.setItem('site-theme', theme); } catch(e) {}
  try { document.cookie = 'site-theme=' + encodeURIComponent(theme) + ';path=/;max-age=31536000'; } catch(e) {}
  window.__INITIAL_THEME = theme;
})();
</script>

<h1>Калькулятор swap</h1>
<p class="lead">Сколько места выделить под swap-раздел.</p>

<section>
<h2>Введи параметры</h2>
<label style="display:block;margin:0.5rem 0;">RAM (ГБ):
<input type="number" id="ram" value="16" min="1" max="128" style="width:80px;background:var(--panel);color:var(--text);border:1px solid var(--border);padding:0.3rem;font-family:inherit;"></label>

<label style="display:block;margin:0.5rem 0;">Хочешь гибернацию?
<input type="checkbox" id="hibernate"></label>

<label style="display:block;margin:0.5rem 0;">Использование:
<select id="usage" style="background:var(--panel);color:var(--text);border:1px solid var(--border);padding:0.3rem;font-family:inherit;">
<option value="desktop">Домашний десктоп</option>
<option value="server">Сервер</option>
<option value="gaming">Геймерский ПК</option>
<option value="light">Лёгкий ноутбук / SSD</option>
</select></label>

<button class="btn" onclick="calcSwap()">Рассчитать</button>
</section>

<script>
function calcSwap() {
  var ram = parseInt(document.getElementById('ram').value, 10) || 16;
  var hib = document.getElementById('hibernate').checked;
  var u = document.getElementById('usage').value;
  var swap;
  if (hib) swap = ram + 2;
  else if (ram <= 2) swap = ram * 2;
  else if (ram <= 8) swap = ram;
  else if (ram <= 16) swap = 4;
  else swap = 4;
  if (u === 'server') swap = Math.max(swap, 8);
  if (u === 'gaming') swap = Math.max(swap, 8);
  if (u === 'light') swap = Math.max(swap, 2);

  document.getElementById('result').innerHTML =
    '<div class="test-result"><h2>Рекомендуется: ' + swap + ' ГБ swap</h2>' +
    '<p>При RAM ' + ram + ' ГБ' + (hib ? ' и включённой гибернации' : '') + '.</p>' +
    '<p style="color:var(--muted);font-size:0.9rem;">Для Ubuntu 24.04+ и большинства современных систем swap по умолчанию — файл, а не раздел. Меняется через <code>/etc/fstab</code> или <code>systemd-swap</code>.</p></div>';
}
</script>
