<script>
(function() {
  function getFromUrl() {
    try {
      var m = window.location.search.match(/[?&]theme=([^&]+)/);
      if (m) return decodeURIComponent(m[1]);
      var h = window.location.hash.match(/theme=([^&]+)/);
      if (h) return decodeURIComponent(h[1]);
    } catch(e) {}
    return null;
  }
  function getFromStorage() {
    try { var v = localStorage.getItem('site-theme'); if (v) return v; } catch(e) {}
    try {
      var m = document.cookie.match(/(?:^|;\s*)site-theme=([^;]+)/);
      if (m) return decodeURIComponent(m[1]);
    } catch(e) {}
    return null;
  }
  var theme = getFromUrl() || getFromStorage() || 'default';
  if (theme && theme !== 'default') {
    document.documentElement.setAttribute('data-site-theme', theme);
  }
  // Сохраняем для следующих страниц
  try { localStorage.setItem('site-theme', theme); } catch(e) {}
  try { document.cookie = 'site-theme=' + encodeURIComponent(theme) + ';path=/;max-age=31536000'; } catch(e) {}
  window.__INITIAL_THEME = theme;
})();
</script>

var NAMES = { debian:'Debian', ubuntu:'Ubuntu', mint:'Linux Mint', lmde:'LMDE', 'pop-os':'Pop!_OS', zorin:'Zorin OS', elementary:'elementary OS', kali:'Kali Linux', parrot:'Parrot OS', mxlinux:'MX Linux', antix:'antiX', deepin:'Deepin', fedora:'Fedora', almalinux:'AlmaLinux', rocky:'Rocky Linux', arch:'Arch Linux', manjaro:'Manjaro', endeavouros:'EndeavourOS', cachyos:'CachyOS', garuda:'Garuda', steamos:'SteamOS', artix:'Artix', opensuse:'openSUSE', gentoo:'Gentoo', slackware:'Slackware', void:'Void Linux', nixos:'NixOS', alpine:'Alpine', tails:'Tails', qubes:'Qubes OS', nobara:'Nobara', bazzite:'Bazzite' };

var aSel = document.getElementById('a'), bSel = document.getElementById('b');
Object.keys(DATA).forEach(function(k){
  [aSel, bSel].forEach(function(s){
    var o = document.createElement('option');
    o.value = k; o.textContent = NAMES[k] || k;
    s.appendChild(o);
  });
});
aSel.value = 'ubuntu'; bSel.value = 'fedora';

function compare() {
  var a = DATA[aSel.value], b = DATA[bSel.value];
  var rows = [
    ['Семейство', a.family, b.family],
    ['Основа', a.base, b.base],
    ['Рабочий стол', a.de, b.de],
    ['Релизы', a.release, b.release],
    ['Сложность', a.difficulty, b.difficulty],
    ['Для кого', a.for, b.for],
    ['Пакеты', a.package, b.package],
    ['Init', a.init, b.init]
  ];
  var html = '<div class="compare-result"><table><thead><tr><th></th><th>' + NAMES[aSel.value] + '</th><th>' + NAMES[bSel.value] + '</th></tr></thead><tbody>';
  rows.forEach(function(r){
    var diff = r[1] !== r[2] ? ' style="color:var(--accent);"' : '';
    html += '<tr><td>' + r[0] + '</td><td' + diff + '>' + r[1] + '</td><td' + diff + '>' + r[2] + '</td></tr>';
  });
  html += '</tbody></table><p style="margin-top:1rem;"><a href="distros/' + aSel.value + '.html" class="btn">Открыть ' + NAMES[aSel.value] + '</a> <a href="distros/' + bSel.value + '.html" class="btn">Открыть ' + NAMES[bSel.value] + '</a></p></div>';
  document.getElementById('result').innerHTML = html;
}
compare();
