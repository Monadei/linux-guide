<script>
(function() {
  function getFromUrl() {
    try {
      var m = window.location.search.match(/[?&]theme=([^&]+)/);
      if (m) return decodeURIComponent(m[1]);
      var h = window.location.hash.match(/theme=([^&]+)/);
      if (h) return decodeURIComponent(h[1]);
    } catch(e) {}
    return null;
  }
  function getFromStorage() {
    try { var v = localStorage.getItem('site-theme'); if (v) return v; } catch(e) {}
    try {
      var m = document.cookie.match(/(?:^|;\s*)site-theme=([^;]+)/);
      if (m) return decodeURIComponent(m[1]);
    } catch(e) {}
    return null;
  }
  var theme = getFromUrl() || getFromStorage() || 'default';
  if (theme && theme !== 'default') {
    document.documentElement.setAttribute('data-site-theme', theme);
  }
  // Сохраняем для следующих страниц
  try { localStorage.setItem('site-theme', theme); } catch(e) {}
  try { document.cookie = 'site-theme=' + encodeURIComponent(theme) + ';path=/;max-age=31536000'; } catch(e) {}
  window.__INITIAL_THEME = theme;
})();
</script>

<script src="js/theme.js"></script><script src="js/search.js"></script><script src="js/extras.js"></script><script>
function pickDistro() {
  var ram = parseInt(document.getElementById('ram').value, 10) || 8;
  var age = document.getElementById('age').value;
  var gpu = document.getElementById('gpu').value;
  var exp = document.getElementById('exp').value;
  var rec;
  if (ram <= 2 || age === 'ancient') rec = { name:'antiX', slug:'antix', why:'Работает на 256 МБ RAM, лёгкий оконный менеджер.' };
  else if (ram <= 4 && age === 'old') rec = { name:'Lubuntu', slug:'lubuntu', why:'Ubuntu с лёгким LXQt.' };
  else if (ram <= 4) rec = { name:'Xubuntu', slug:'xubuntu', why:'Ubuntu с Xfce.' };
  else if (gpu === 'nvidia' && age !== 'new' && exp === 'new') rec = { name:'Linux Mint', slug:'mint', why:'Простой, драйверы NVIDIA ставятся через менеджер драйверов.' };
  else if (gpu === 'nvidia' && exp === 'new') rec = { name:'Pop!_OS', slug:'pop-os', why:'ISO с готовыми драйверами NVIDIA.' };
  else if (gpu === 'nvidia' && exp === 'exp') rec = { name:'CachyOS', slug:'cachyos', why:'Arch с оптимизацией и автоустановкой NVIDIA.' };
  else if (exp === 'new') rec = { name:'Linux Mint', slug:'mint', why:'Универсальный выбор для новичка.' };
  else if (exp === 'some') rec = { name:'Fedora', slug:'fedora', why:'Свежие технологии, хорошая поддержка.' };
  else rec = { name:'Arch Linux', slug:'arch', why:'Полный контроль, rolling release.' };
  document.getElementById('result').innerHTML =
    '<div class="test-result"><h2>Тебе подойдёт: ' + rec.name + '</h2>' +
    '<p>' + rec.why + '</p>' +
    '<p><a href="distros/' + rec.slug + '.html" class="btn">Открыть страницу →</a></p></div>';
  document.getElementById('result').scrollIntoView({behavior:'smooth'});
}
</script>
